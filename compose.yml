version: '3.8'

services:
  database:
    image: postgres:15
    container_name: saferoute-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saferoute}
      POSTGRES_USER: ${POSTGRES_USER:-saferoute_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d
    networks:
      - saferoute-network

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: saferoute-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-saferoute}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-saferoute_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - saferoute-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: saferoute-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - saferoute-network

volumes:
  postgres_data:

networks:
  saferoute-network:
    driver: bridge