spring:
  application:
    name: saferoute-backend
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:saferoute}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.saferoute: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Twilio Configuration for OTP SMS
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

# WhatsApp Business API Configuration
whatsapp:
  api:
    url: https://graph.facebook.com/v22.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
    token: ${WHATSAPP_API_TOKEN}
  base-url: ${APP_BASE_URL}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# OTP Configuration
otp:
  length: 6                  # Longitud del código OTP (6 dígitos)
  expiration-minutes: 5      # Código válido por 5 minutos
  max-attempts: 3            # Máximo 3 intentos de verificación

# Hashids Configuration for URL obfuscation
saferoute:
  hashids:
    salt: ${HASHIDS_SALT}  # Clave secreta para generar hashes (debe ser única)
    min-length: 15                                  # Longitud mínima del hash generado

---
spring:
  jpa:
    hibernate:
      ddl-auto: none
spring.config.activate.on-profile: dev

---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/saferoute
spring.config.activate.on-profile: docker

---
spring:
  jpa:
    show-sql: false
  logging:
    level:
      com.saferoute: WARN
spring.config.activate.on-profile: prod