spring:
  application:
    name: saferoute-backend
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://localhost:5432/saferoute
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.saferoute: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Twilio Configuration for OTP SMS
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC2cd6b16cdb8c4bdf5b0beec6e8bfca8e}
  auth-token: ${TWILIO_AUTH_TOKEN:4a6c857d56954a31b6e7cecf591a74cc}
  phone-number: ${TWILIO_PHONE_NUMBER:+16204078479}

# OTP Configuration
otp:
  length: 6                  # Longitud del código OTP (6 dígitos)
  expiration-minutes: 5      # Código válido por 5 minutos
  max-attempts: 3            # Máximo 3 intentos de verificación

---
spring:
  jpa:
    hibernate:
      ddl-auto: none
spring.config.activate.on-profile: dev

---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/saferoute
spring.config.activate.on-profile: docker

---
spring:
  jpa:
    show-sql: false
  logging:
    level:
      com.saferoute: WARN
spring.config.activate.on-profile: prod